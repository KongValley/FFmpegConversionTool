appId: com.local.media-converter
productName: 音视频转换工具
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
win:
  icon: build/icon.png
  target:
    - target: zip
      arch:
        - x64
  artifactName: media-converter-${version}-win-x64.${ext}
publish:
  provider: github
  owner: KongValley
  repo: FFmpegConversionTool
  releaseType: release
